:root{--bg:#0B2440;--rail:#071A2F;--pn:#12345A;--y:#FFD23F;--court:#1E7A5C;--tx:#EAF2FA;--mu:#8FB0CC;--bd:#2A4A6E;--ok:#3DDC97;--bad:#FF6B5B;--line:#1E4670}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,select,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{outline:none}
.app{display:flex;min-height:100vh}
nav{width:104px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0;position:sticky;top:0;height:100vh}
.logo{width:84px;height:84px;object-fit:contain;margin-bottom:10px}
.lvb button.on{background:var(--y);color:var(--bg)}
.dlock{width:56px;height:56px;border-radius:14px;border:2px solid var(--bd);background:var(--pn);color:var(--tx);display:flex;align-items:center;justify-content:center;flex:none}
.dlock.on{background:var(--y);color:var(--bg);border-color:var(--y)}
.prd{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.prd .row{gap:6px}
.orgc{height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-weight:600;font-size:15px}
.orgc.on{background:var(--y);color:var(--bg);border-color:var(--y)}
.tab{width:80px;height:72px;border-radius:16px;border:0;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.tab.on{background:var(--y);color:var(--bg);font-weight:700}
.tab svg{width:24px;height:24px}
main{flex:1;min-width:0;padding:26px 34px 48px;display:flex;flex-direction:column;gap:18px;position:relative}
.d{font-family:'Big Shoulders Display',sans-serif;font-weight:900}
h1{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:60px;line-height:.9}
h1 span{color:var(--y)}
.lab{font-size:13px;letter-spacing:.14em;color:var(--mu);font-weight:600}
.laby{font-size:13px;letter-spacing:.14em;color:var(--y);font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.sb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pn{background:var(--pn);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.btn{height:52px;padding:0 24px;border-radius:12px;border:0;background:var(--y);color:var(--bg);font-weight:700;font-size:17px;white-space:nowrap}
.btn.sh{box-shadow:0 5px 0 #C9A01E}
.gh{height:44px;padding:0 14px;border-radius:10px;border:2px dashed var(--bd);background:transparent;color:var(--mu);font-weight:600;font-size:14px;white-space:nowrap}
.ol{height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-weight:600;font-size:15px;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:10px;border:0;background:var(--bg);color:var(--tx);font-size:22px;flex:none}
.inp{height:52px;border-radius:12px;border:0;background:var(--bg);color:var(--tx);font-weight:500;font-size:18px;padding:0 16px;min-width:0}
.sel{height:44px;border-radius:10px;border:2px solid var(--bd);background:var(--pn);color:var(--tx);font-weight:600;font-size:15px;padding:0 10px;max-width:100%}
.tile{background:var(--pn);border-radius:14px;padding:10px 18px;text-align:center;min-width:110px}
.tile b{display:block;font:900 34px 'Big Shoulders Display',sans-serif}
.tile i{font-style:normal;font-size:12px;color:var(--mu)}
.chipd{height:40px;padding:0 8px 0 14px;border-radius:10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border:0;background:var(--pn);color:var(--tx)}
.chipd.on{background:var(--y);color:var(--bg)}
.chipd em{font-style:normal;font-size:11px;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:var(--bg);color:var(--mu)}
.chipd.on em{color:var(--y)}
.lvb{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.lvb button{height:44px;padding:0 11px;border-radius:9px;white-space:nowrap;border:0;font-weight:600;font-size:15px;background:transparent;color:var(--mu)}
.warn{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px}
.warn.red{background:var(--bad);color:var(--bg)}
.warn.yel{background:#3A2F14;color:var(--y);border:1px solid var(--y)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--pn);border:0;text-align:left;width:100%}
.pc.off{opacity:.5}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--bg);border:0;flex:none}
.sw{width:52px;height:30px;border-radius:15px;padding:3px;display:flex;background:#2A4A6E;justify-content:flex-start;flex:none}
.sw.on{background:var(--ok);justify-content:flex-end}
.sw span{width:24px;height:24px;border-radius:50%;background:#fff;display:block}
.search{flex:1;display:flex;align-items:center;gap:10px;height:52px;border-radius:14px;border:2px solid var(--bd);padding:0 6px 0 16px;color:var(--mu)}
.search input{flex:1;height:44px;border:0;background:transparent;color:var(--tx);font-weight:500;font-size:17px;min-width:0}
.empty{padding:26px;text-align:center;color:var(--mu);font-size:16px}
/* games */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.court{position:relative;height:190px;border-radius:6px;background:var(--court);border:4px solid var(--tx);display:flex}
.court .l1{position:absolute;inset:18px 0;border-top:2px solid rgba(255,255,255,.75);border-bottom:2px solid rgba(255,255,255,.75)}
.court .l2{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.75)}
.court .net{position:absolute;top:-10px;bottom:-10px;left:50%;width:6px;margin-left:-3px;background:repeating-linear-gradient(0deg,#EAF2FA 0 3px,transparent 3px 7px);border-left:2px solid #EAF2FA;border-right:2px solid #EAF2FA}
.court .no{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.12em;padding:3px 10px;border-radius:99px;white-space:nowrap}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 16px;position:relative;min-width:0}
.side.r{align-items:flex-end}
.pchip{background:var(--bg);color:var(--tx);border-radius:9px;padding:6px 12px;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc{width:40px;height:40px;border-radius:10px;border:0;background:rgba(11,36,64,.6);color:#fff;font-size:20px}
.sc.p{background:var(--y);color:var(--bg);font-weight:700}
.scn{font:900 40px 'Big Shoulders Display',sans-serif;width:50px;text-align:center;color:var(--y)}
.cwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;font-weight:600;font-size:16px}
.tbar{display:flex;align-items:center;gap:10px;background:var(--pn);border-radius:14px;padding:6px 6px 6px 16px}
.tdot{width:12px;height:12px;border-radius:50%;background:#3A5E86;flex:none}
.tdot.run{background:var(--bad)}
.tbtn{height:46px;padding:0 20px;border-radius:10px;border:0;font-weight:700;font-size:16px;background:var(--ok);color:var(--bg);white-space:nowrap}
.tbtn.run{background:var(--bad)}
.nm{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:4px;padding:3px 3px 3px 10px;font-size:15px;flex:1;min-width:0;justify-content:space-between;background:var(--pn);border-radius:9px;font-weight:600;overflow:hidden;white-space:nowrap}
.slot button{width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.08);color:var(--mu);font-size:16px;flex:none}
.slotsel{flex:1;min-width:0;height:40px;border-radius:9px;border:2px dashed var(--y);background:var(--pn);color:var(--tx);font-weight:600;font-size:14px;padding:0 6px}
.bch{border-radius:9px;padding:5px 12px;font-weight:700;font-size:14px;color:var(--bg);display:flex;flex-direction:column;align-items:center;line-height:1.2;background:var(--y)}
.bch.red{background:var(--bad)}
.bch small{font-size:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{padding:6px 8px;font-weight:600;color:var(--mu);font-size:12px;letter-spacing:.08em;text-align:left}
td{padding:8px;border-top:1px solid var(--line)}
.win{background:var(--y);color:var(--bg);border-radius:99px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}
/* finance */
.btile{border-radius:14px;padding:10px 18px;min-width:116px}
.btile i{font-style:normal;font-size:12px;color:var(--mu);display:block}
.btile b{font:900 32px 'Big Shoulders Display',sans-serif}
.paybtn{width:104px;height:44px;border-radius:10px;font-weight:700;font-size:15px;background:transparent;color:var(--bad);border:2px solid var(--bad);flex:none}
.paybtn.on{background:var(--ok);color:var(--bg);border:0}
.fin{height:52px;width:100%;border-radius:12px;border:2px solid var(--y);background:var(--bg);color:var(--tx);font-weight:700;font-size:22px;padding:0 14px}
.box{background:var(--bg);border-radius:10px;padding:10px 16px;color:var(--tx);font-weight:600}
.tube{width:26px;height:40px;border-radius:13px 13px 6px 6px;border:2px solid #3A5E86;background:transparent;padding:0}
.tube.on{border-color:var(--y);background:var(--y)}
.fc{height:44px;padding:0 16px;border-radius:10px;font-weight:600;font-size:15px;background:transparent;color:var(--tx);border:2px solid var(--bd);white-space:nowrap}
.fc.on{background:var(--y);color:var(--bg);border-color:var(--y)}
.srow{background:var(--bg);border-radius:14px;overflow:hidden}
.srow>button{width:100%;min-height:60px;display:grid;grid-template-columns:150px 1fr 110px 110px 110px 120px 24px;align-items:center;gap:10px;padding:8px 16px;border:0;background:transparent;color:var(--tx);font-weight:500;font-size:15px;text-align:left}
.srow small{display:block;font-size:11px;color:var(--mu)}
.pill{justify-self:start;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;background:#3A1E22;color:var(--bad)}
.pill.ok{background:#123F33;color:var(--ok)}
.sbox{background:var(--pn);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv span:first-child{color:var(--mu)}
.kv span:last-child{font-weight:600;text-align:right}
.lock{position:absolute;inset:0;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding-top:70px;z-index:5;min-height:760px}
.key{width:84px;height:68px;border-radius:16px;font-weight:600;font-size:26px;border:2px solid var(--bd);background:var(--pn);color:var(--tx)}
.pdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu)}
.pdot.on{background:var(--y);border-color:var(--y)}
textarea{width:100%;min-height:160px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;padding:12px;font-family:monospace;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(4,14,26,.75);display:flex;align-items:center;justify-content:center;z-index:20}
.modal.tall{align-items:flex-start;overflow-y:auto;padding:24px 0}
.ckg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ckr{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 10px}.ckr.gone{opacity:.55}
.ckb{height:44px;padding:0 16px;font-size:15px}.dtag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mu);border:1px solid var(--mu);border-radius:6px;padding:1px 5px}
.tap{cursor:pointer}tr.tap:active td{background:rgba(255,210,63,.12)}.gei{height:48px;font-size:17px;background:var(--bg);color:var(--tx);border:1px solid #2A4E78;border-radius:10px;padding:0 10px;min-width:0;width:100%}.modal .pn{width:min(760px,92vw);padding:22px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--y);color:var(--bg);font-weight:700;padding:12px 22px;border-radius:99px;z-index:50;display:none}
/* welcome */
#wel{position:fixed;inset:0;z-index:100;background:#0B2440;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
#wel.hide{opacity:0;transition:opacity .35s;pointer-events:none}
#stage{position:relative;width:1194px;height:834px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform-origin:center}
@keyframes drop{0%{transform:translateY(-700px) rotate(-12deg) scale(.7);opacity:0}8%{opacity:1}16%{transform:translateY(0) rotate(0) scale(1.12,.86)}21%{transform:translateY(-60px) scale(.95,1.06)}26%{transform:translateY(0) scale(1.05,.95)}30%,100%{transform:translateY(0) scale(1)}}
@keyframes shake{0%,30%,40%,100%{transform:translate(0,0)}32%{transform:translate(-10px,4px) rotate(-1.5deg)}34%{transform:translate(9px,-3px) rotate(1.2deg)}36%{transform:translate(-5px,2px)}38%{transform:translate(3px,-1px)}}
@keyframes shot{0%,22%{transform:translate(520px,-420px) rotate(-30deg);opacity:0}23%{opacity:1}30%{transform:translate(0,0) rotate(-30deg);opacity:1}31%,100%{transform:translate(0,0) rotate(-30deg);opacity:0}}
@keyframes streak{0%,22%{stroke-dashoffset:700;opacity:0}23%{opacity:1}30%{stroke-dashoffset:0;opacity:1}44%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes burst{0%,29%{transform:scale(.2);opacity:0}32%{transform:scale(1);opacity:1}46%,100%{transform:scale(1.7);opacity:0}}
@keyframes ring{0%,29%{transform:scale(.3);opacity:0}31%{opacity:.9}50%,100%{transform:scale(2.2);opacity:0}}
@keyframes flash{0%,29%{opacity:0}31%{opacity:.55}45%,100%{opacity:0}}
@keyframes beam{0%{opacity:0}40%{opacity:.5}70%{opacity:.25}100%{opacity:.45}}
@keyframes sweepL{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(-8deg)}}
@keyframes sweepR{0%,100%{transform:rotate(22deg)}50%{transform:rotate(8deg)}}
@keyframes shine{0%,40%{transform:translateX(-520px) skewX(-20deg)}58%,100%{transform:translateX(520px) skewX(-20deg)}}
@keyframes tapin{0%,62%{opacity:0;transform:translateY(16px)}72%,100%{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spark{0%,31%{transform:translate(0,0) scale(1);opacity:0}33%{opacity:1}55%,100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#wel .a{animation-duration:2.6s;animation-iteration-count:1;animation-fill-mode:both}
.beam{position:absolute;top:-40px;width:260px;height:760px;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,240,180,.55),rgba(255,240,180,0) 85%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}

.gear{margin-top:auto}
.wonb{height:46px;padding:0 10px;border-radius:10px;border:2px solid var(--y);background:transparent;color:var(--y);font-weight:700;font-size:14px;white-space:nowrap}
.wonb.on{background:var(--y);color:var(--bg)}
.sbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--pn);border-radius:14px;padding:8px 14px;font-size:13px;letter-spacing:.08em;color:var(--mu);font-weight:600}
.sbar .inp{height:40px;width:84px;font-size:16px}
.sbar .sel{height:40px;background:var(--bg)}
.tbtn{padding:0 14px}
/* v5 */
.app.full nav{display:none}.app.full main{padding:0;gap:0}
.ndot{position:absolute;top:8px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--bad)}.tab{position:relative}
.nb{font-style:normal;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:6px;padding:2px 6px;margin-left:4px}
.home{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
.hleft{background:var(--rail);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px;position:sticky;top:0;height:100vh}
#homeLogo{width:260px;height:260px;object-fit:contain;display:block}
.hright{padding:36px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.home.pre #homeLogo{visibility:hidden}.home.pre .hin{opacity:0}
.home.go .hin{animation:fin .45s ease both}.home.go .hin:nth-child(2){animation-delay:.1s}.home.go .hin:nth-child(3){animation-delay:.2s}.home.go .hin:nth-child(4){animation-delay:.3s}
@keyframes fin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glide{position:fixed;z-index:150;transform-origin:0 0;transition:transform .6s cubic-bezier(.5,0,.2,1);pointer-events:none;object-fit:contain}
.gearb{width:52px;height:52px;border-radius:14px;background:var(--pn);color:var(--mu);position:relative;display:flex;align-items:center;justify-content:center}.gearb svg{width:26px;height:26px}
.today{display:flex;gap:10px;align-items:stretch}
.tgo{flex:1;display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:18px;background:var(--court);color:var(--tx);border:2px solid var(--ok);text-align:left}
.today.run .tgo{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(61,220,151,.18)}}
.tplay{width:56px;height:56px;border-radius:50%;background:var(--ok);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.ttag{display:block;font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--ok)}.ttl{display:block;font-size:22px;font-weight:700;margin-top:2px}.tsub{display:block;font-size:15px;color:#CFE8DD;margin-top:2px}
.tbtnl{font-weight:700;font-size:16px;color:var(--y);white-space:nowrap}.tedit{height:auto}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.hbig{height:200px;border-radius:22px;background:var(--pn);color:var(--tx);padding:24px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;border:2px solid var(--bd)}
.hbig.y{background:var(--y);color:var(--bg);border-color:var(--y)}.hbig b{display:block;font-size:38px;line-height:.95}.hbig i{display:block;font-style:normal;font-size:15px;margin-top:6px;opacity:.85}
.uprow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.udate{width:50px;text-align:center;flex:none}.udate b{display:block;font-size:12px;color:var(--y)}.udate span{font:900 28px 'Big Shoulders Display',sans-serif;line-height:1}
.rep{font-size:11px;letter-spacing:.08em;color:var(--y);border:1px solid var(--y);border-radius:6px;padding:1px 5px;margin-left:4px}
.ol.sm{height:44px;padding:0 14px;font-size:14px;border-radius:10px}.ol.sm2{height:52px;padding:0 16px;font-size:14px}
.fc.sm{height:38px;padding:0 12px;font-size:14px}.orgc.sm{height:40px;font-size:14px;padding:0 12px}
.scr{padding:28px 36px 48px;display:flex;flex-direction:column;gap:20px}
.ib.back{width:52px;height:52px;border-radius:14px;background:var(--pn);display:flex;align-items:center;justify-content:center}
.ib.xl{width:56px;height:56px;border-radius:14px;font-size:28px}
.schg{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
.dchip{height:48px;padding:0 16px;border-radius:12px;border:0;font-weight:600;font-size:15px;background:var(--bg);color:var(--tx)}.scr>.row>.dchip{background:var(--pn)}.scr>.row>.dchip.on{background:var(--y)}
.dchip.on{background:var(--y);color:var(--bg)}.dpick{height:48px;background:var(--bg)}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu);font-weight:600;min-width:0;letter-spacing:.04em}
.sel.big{height:52px;font-size:18px;background:var(--bg)}
.crow{background:var(--pn);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr 200px 1fr;gap:12px;align-items:end}
.cno{width:44px;height:44px;border-radius:12px;background:var(--court);display:flex;align-items:center;justify-content:center;font-size:24px;align-self:center}
.tl{flex:1;height:22px;background:var(--bg);border-radius:6px;overflow:hidden}.tl div{height:100%;background:var(--court);border:2px solid var(--ok);border-radius:6px}
.sfoot{display:flex;align-items:center;gap:16px;background:var(--rail);border-radius:18px;padding:14px 18px;position:sticky;bottom:12px}
.sfoot i{display:block;font-style:normal;font-size:12px;color:var(--mu)}.sfoot b{font-size:22px}
.histg{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
.mhead{display:flex;justify-content:space-between;align-items:center;width:100%;height:48px;padding:0 12px;border-radius:12px;border:0;font-weight:700;font-size:17px;background:transparent;color:var(--tx)}
.mhead.pnh{background:var(--pn)}.mhead.on{background:var(--y);color:var(--bg)}
.hrow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border-radius:12px;background:var(--bg);border:2px solid transparent;color:var(--tx)}.hrow.on{border-color:var(--y)}
.badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;background:#3A2F14;color:var(--y)}.badge.ok{background:#123F33;color:var(--ok)}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;align-self:flex-start}
.seg button{height:44px;padding:0 22px;border-radius:9px;border:0;font-weight:600;font-size:15px;background:transparent;color:var(--mu)}.seg button.on{background:var(--y);color:var(--bg)}
.pname{display:block;width:100%;border:0;background:transparent;padding:0;text-align:left;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att{margin-top:6px;height:34px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px;border:2px dashed var(--mu);background:transparent;color:var(--mu);display:inline-flex;align-items:center}
.att.in{border:0;background:#123F33;color:var(--ok)}.att.left{border:0;background:#3A2F14;color:var(--y)}
.cblock{display:flex;flex-direction:column;gap:8px}
.cstrip{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--pn);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mu)}.cstrip b{color:var(--tx);font-size:16px;letter-spacing:.06em}
.cstrip.off{opacity:.55}.court.big{height:200px}.court.big .pchip{font-size:19px;padding:8px 14px}.court.shut{filter:grayscale(1);opacity:.45}
.bch{border:0}.bch.gr{background:#2A4A6E;color:var(--mu)}
tr.redr td{background:rgba(255,107,91,.16)}tr.redr td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
tr.grp td{background:var(--bg);color:var(--y);font-weight:700;font-size:12px;letter-spacing:.12em}
.tipbox{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tip{display:flex;gap:8px;font-size:14px;line-height:1.35}.tip>span:first-child{color:var(--y);font-weight:700}
.cbh{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:2px 4px 2px 10px;color:var(--tx);letter-spacing:.02em}
.cbh button{width:34px;height:34px;border-radius:8px;border:0;background:var(--pn);color:var(--tx);font-size:18px}
.ingrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.dbx{width:44px;height:44px;flex:none;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--bg);font-size:24px;font-weight:900}.dbx.on{background:var(--y);border-color:var(--y)}
.fin.ro{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;overflow:hidden;line-height:1.05;border-color:var(--bd);color:var(--tx)}.fin.ro small{font-size:11px;color:var(--mu);font-weight:600;white-space:nowrap}
.btile small{display:block;font-size:11px;color:var(--mu);max-width:230px}
.ptag{height:36px;padding:0 10px;border-radius:9px;border:0;background:#123F33;color:var(--ok);font-weight:600;font-size:13px;white-space:nowrap}
.qrb{height:40px;padding:0 12px;border-radius:9px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-weight:700;font-size:13px;white-space:nowrap}
.mt{background:var(--pn);border-radius:14px;padding:12px 16px}.mt>div{font-size:12px;color:var(--mu);font-weight:600}.mt b{font-size:28px;line-height:1.15;white-space:nowrap}
.ub{background:var(--bg);color:var(--tx);border-radius:14px;padding:14px 16px}.ub>div:first-child{font-size:12px;color:var(--mu);font-weight:600}.ub b{display:block;font-size:26px;line-height:1.1;white-space:nowrap}.ub i{font-style:normal;font-size:12px;color:var(--mu)}
.kv2{display:flex;justify-content:space-between;align-items:baseline}.kv2 b{font-size:20px}
.erow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.etag{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:var(--bg);white-space:nowrap}
.split{display:flex;height:26px;border-radius:8px;overflow:hidden}
#print{display:none}
.rp{color:#0B2440;font-family:Outfit,sans-serif;font-size:10pt}
.rp h2{font:900 22pt 'Big Shoulders Display',sans-serif;margin:0 0 1mm}
.rp .meta{color:#4A6A88;margin-bottom:2mm}
.rp .rhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #FFD23F;padding-bottom:2mm;margin-bottom:4mm}
.rp .rhead b{font:900 18pt 'Big Shoulders Display',sans-serif}
.rp .bar{background:#0B2440;color:#FFD23F;padding:1.5mm 3mm;font-weight:700;letter-spacing:.08em;font-size:9pt;border-radius:1.5mm;margin:4mm 0 1mm;break-after:avoid}
.rp table{font-size:9.5pt;width:100%}
.rp th{color:#4A6A88;font-size:8pt;padding:1mm 2mm}
.rp td{border-top:1px solid #C8D6E4;padding:1mm 2mm}
.rp tr{break-inside:avoid}
.rp .tl{display:grid;grid-template-columns:repeat(5,1fr);gap:2mm;margin:2mm 0}
.rp .tl div{border:1px solid #C8D6E4;border-radius:2mm;padding:1.5mm 3mm;background:#fff}
.rp .tl i{display:block;font-style:normal;font-size:8pt;color:#4A6A88}
.rp .tl b{font:900 15pt 'Big Shoulders Display',sans-serif;white-space:nowrap}
.rp .cols{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.rp .pb{break-before:page}
.rp .keep{break-inside:avoid}
.rp .ult{background:#FFD23F;border-radius:3mm;padding:3mm 4mm;margin-top:4mm}
@media print{@page{size:A4 landscape;margin:10mm}html,body{background:#fff!important}#wel,.app,#modal,#toast{display:none!important}#print{display:block}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LVN=['Beginner','Beginner +','Intermediate','Intermediate +','Advanced'];
const LVC=['#3DDC97','#9BE36D','#FFD23F','#FF9F43','#FF6B5B'];
const KEY='rebels.v1';
const NB=window.Android||null;

function blank(){return{v:3,nid:1,players:[],locs:['Venue A','Venue B'],days:{},games:{},fin:{},pin:'',
  def:{pts:21,deuce:true,slot:15,chg:2,court:'',fee:'',spt:12},orgs:[],series:[],ent:[],rules:[],ovr:[],eid:1,lastBy:'',lastM:'cash',newRules:0,savedAt:0}}
function parse(t){try{const s=JSON.parse(t);if(s&&s.v&&Array.isArray(s.players))return Object.assign(blank(),s)}catch(e){}return null}
let S=null;
try{S=parse(localStorage.getItem(KEY))}catch(e){}
if(!S&&NB&&NB.loadFile){try{S=parse(NB.loadFile())}catch(e){}}
if(!S)S=blank();

  try{localStorage.setItem(KEY,t)}catch(e){toast('Could not save – export a backup')}
  if(NB&&NB.saveFile){try{NB.saveFile(t)}catch(e){}}}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',2200)}

/* ---------- dates & numbers ---------- */
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const TODAY=()=>iso(new Date());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dlab=s=>{const d=pd(s);return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]};
const dshort=s=>{const d=pd(s);return d.getDate()+' '+MN[d.getMonth()]};
const mlab=m=>{const a=m.split('-');return MNF[+a[1]-1]+' '+a[0]};
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600);return h?h+':'+z(Math.floor(s%3600/60))+':'+z(s%60):z(Math.floor(s/60))+':'+z(s%60)};
const fmtL=s=>{s=Math.max(0,Math.floor(s));return s>=3600?Math.floor(s/3600)+'h '+z(Math.floor(s%3600/60))+'m':fmt(s)};
const fmtH=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/3600)+'h '+z(Math.floor(s%3600/60))+'m'};
const num=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const A=v=>'AED '+v.toFixed(2);
const A0=v=>'AED '+Math.round(v).toLocaleString('en-US');
const sg=v=>(v<0?'−':'+')+Math.abs(v).toFixed(2);
const hm=ms=>{const x=new Date(ms);return z(x.getHours())+':'+z(x.getMinutes())};
const tms=(d,v)=>{if(!v)return 0;const a=v.split(':').map(Number),x=pd(d);x.setHours(a[0]||0,a[1]||0,0,0);return x.getTime()};
const t12=v=>{if(!v)return '';const a=v.split(':').map(Number),h=a[0]%12||12;return h+':'+z(a[1]||0)+' '+(a[0]<12?'am':'pm')};
const hrsL=h=>(h%1?h.toFixed(1):h)+' h';
const pl=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- players ---------- */
const P=id=>S.players.find(p=>p.id===id);
const nameOf=id=>{const p=P(id);return p?p.name:'?'};
const lvOf=id=>{const p=P(id);return p?p.lv:0};
const active=()=>S.players.filter(p=>!p.gone).sort((a,b)=>a.name.localeCompare(b.name));
const pchip=id=>'box-shadow:inset 0 -3px 0 '+LVC[lvOf(id)];
const isOrg=id=>(S.orgs||[]).includes(id);

/* ---------- scheduled sessions (one per date) ---------- */
const D_=d=>S.days[d];
const isSched=d=>{const D=S.days[d];return !!(D&&D.sch&&!D.x)};
function mkDay(d,o){S.days[d]=Object.assign({sch:1,time:'20:00',loc:S.locs[0]||'',courts:[{n:'Court 1',h:2}],on:{},att:{}},o||{});return S.days[d]}
function day(d){return S.days[d]||mkDay(d)}
const onIds=d=>{const D=S.days[d];return D?Object.keys(D.on).filter(k=>D.on[k]&&P(k)&&!P(k).gone):[]};
const courtsOf=d=>{const D=S.days[d];return D&&D.courts&&D.courts.length?D.courts:[{n:'Court 1',h:2}]};
const cname=(d,i)=>{const c=courtsOf(d)[i];return c?(c.n||'Court '+(i+1)):'Court '+(i+1)};
const sessLenH=d=>Math.max(...courtsOf(d).map(c=>num(c.h)||0),0);
const courtHrs=d=>courtsOf(d).reduce((a,c)=>a+num(c.h),0);
/* booked start: scheduled time; falls back to the actual start */
function bookStart(d){const D=S.days[d],g=S.games[d];if(D&&D.time)return tms(d,D.time);return g&&g.st?g.st:tms(d,'20:00')}
const courtEnd=(d,i)=>bookStart(d)+num((courtsOf(d)[i]||{}).h)*3600e3;
const sessEnd=d=>bookStart(d)+sessLenH(d)*3600e3;
const upcoming=()=>{const t=TODAY();return Object.keys(S.days).filter(d=>d>t&&isSched(d)).sort()};
const pastSched=()=>{const t=TODAY();return Object.keys(S.days).filter(d=>d<t&&isSched(d)).sort()};
const courtSum=d=>courtsOf(d).map(c=>esc(c.n)+' ('+hrsL(num(c.h))+')').join(' + ');

/* weekly repeat: keeps the next 4 weeks scheduled */
function topUp(){const t=TODAY();(S.series||[]).forEach(s=>{let d=s.from;while(d<t)d=addD(d,7);
  for(let k=0;k<5;k++){const x=addD(d,7*k);if(x>addD(t,28))break;if(!S.days[x]&&!(s.skip||[]).includes(x))mkDay(x,{time:s.time,loc:s.loc,courts:JSON.parse(JSON.stringify(s.courts)),ser:s.id})}})}

/* the session the app works on: today, else the next upcoming one */
function curDate(){const t=TODAY();if(ui.cur&&(isSched(ui.cur)||S.games[ui.cur]))return ui.cur;if(isSched(t))return t;return upcoming()[0]||''}

/* ---------- attendance ---------- */
const att=(d,id)=>{const D=S.days[d];return D&&D.att?D.att[id]||null:null};
const arrived=(d,id)=>{const a=att(d,id);return !!(a&&a.a)};
const leftAt=(d,id)=>{const a=att(d,id);return a&&a.l?a.l:0};
const eligible=(d,id)=>arrived(d,id)&&!leftAt(d,id);
/* dummy = organiser/family filler: no game target, plays only when no regular is free (default: Settings organizers) */
const isDum=(d,id)=>!!(S.dum&&S.dum[id]);
const canStart=d=>{const D=S.days[d],g=S.games[d];return d===TODAY()&&isSched(d)&&!(g&&g.st)&&Date.now()>=tms(d,D.time)-30*60e3};
/* delete a session completely (sample / mistake) */
function delSess(d){const D=S.days[d];if(D&&D.ser){const sr=S.series.find(s=>s.id===D.ser);if(sr){sr.skip=sr.skip||[];if(!sr.skip.includes(d))sr.skip.push(d)}}
  (S.ent||[]).forEach(e=>{if(e.t==='pkg'&&e.dates)e.dates=e.dates.filter(x=>x!==d)});delete S.days[d];delete S.games[d];delete S.fin[d];if(ui.cur===d)ui.cur=''}

/* ===== games: mixing, planner, live auto-adapt, learning ===== */
const blankLive=()=>({run:false,start:0,sa:0,sb:0,el:0,w:''});
const NUL4=()=>[null,null,null,null];
const running=g=>!!(g&&g.st&&!g.en);
const capOf=g=>g.deuce&&+g.pts<30?Math.max(+g.pts,Math.min(30,+g.pts+9)):+g.pts;
const winOf=(g,l)=>g.deuce&&+g.pts<30?Math.min(capOf(g),Math.max(+g.pts,l+2)):+g.pts;
const REST=8*60e3,TGT=5,TMIN=5;
function G(d){let g=S.games[d];
  if(!g){g=S.games[d]={d,courts:1,round:0,cur:[],live:[],nxt:[],nman:[],hist:[],since:{},btot:{},st:0,en:0,pts:S.def.pts,deuce:S.def.deuce,slot:S.def.slot,chg:S.def.chg,ros:[],last:[],plan:[],log:[],strk:{},pre:[],auto:[]}}
  ['nman','log','pre','auto','plan','last','ros','nxt','cur','live'].forEach(k=>{if(!Array.isArray(g[k]))g[k]=[]});if(!g.strk)g.strk={};
  const n=courtsOf(d).length;g.courts=n;g.bh=sessLenH(d);
  while(g.cur.length<n){g.cur.push(NUL4());g.live.push(blankLive())}
  while(g.nxt.length<n)g.nxt.push(NUL4());
  if(g.cur.length>n&&!g.cur.slice(n).some(q=>q&&q.some(Boolean))){g.cur.length=n;g.live.length=n}
  g.nxt.length=Math.min(g.nxt.length,n);
  if(running(g)){const onC=new Set(g.cur.flat().filter(Boolean)),t=Date.now();onIds(d).forEach(id=>{if(eligible(d,id)&&!onC.has(id)&&g.since[id]==null)g.since[id]=t})}
  return g}
const k2=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function counts(g,pending){const c={};g.hist.forEach(h=>h.ids.forEach(id=>c[id]=(c[id]||0)+1));
  if(pending)g.cur.forEach(q=>{if(q&&q.every(Boolean))q.forEach(id=>c[id]=(c[id]||0)+1)});return c}
function effMap(g){const b={};g.hist.slice().reverse().forEach(h=>{const m=Math.abs(h.sa-h.sb);const w=h.sa>h.sb?[h.ids[0],h.ids[1]]:[h.ids[2],h.ids[3]];
  h.ids.forEach(id=>{b[id]=Math.max(0,(b[id]||0)-.25)});if(m>=8&&h.sa!==h.sb)w.forEach(id=>{b[id]=Math.min(1.5,(b[id]||0)+.75)})});
  const e={};S.players.forEach(p=>e[p.id]=p.lv+(b[p.id]||0));return e}
function pairMaps(g){const p={},o={};g.hist.forEach(h=>{const[a1,a2,b1,b2]=h.ids;p[k2(a1,a2)]=(p[k2(a1,a2)]||0)+1;p[k2(b1,b2)]=(p[k2(b1,b2)]||0)+1;
  [[a1,b1],[a1,b2],[a2,b1],[a2,b2]].forEach(([x,y])=>o[k2(x,y)]=(o[k2(x,y)]||0)+1)});return{p,o}}
/* learned rules make their part of the mixing score count double */
const ruleOn=k=>(S.rules||[]).some(r=>r.k===k&&r.on);
const WT=()=>({bal:ruleOn('bal')?6:3,spr:ruleOn('grp')?4:2,rp:ruleOn('fresh')?8:4,ro:1.5,stack:ruleOn('nostack')?120:60});
/* built-in: two Int+ (or stronger) partners only against equally strong opponents */
function stacked(a1,a2,b1,b2){const s=x=>lvOf(x),A2=s(a1)+s(a2),B2=s(b1)+s(b2);
  return (s(a1)>=3&&s(a2)>=3&&B2<A2-1)||(s(b1)>=3&&s(b2)>=3&&A2<B2-1)}
function groupCost(q,e,pr){const w=WT(),v=q.map(id=>e[id]||0);const spread=Math.max(...v)-Math.min(...v);let best=null;
  for(const s of [[0,1,2,3],[0,2,1,3],[0,3,1,2]]){const[a1,a2,b1,b2]=s.map(k=>q[k]);const d=Math.abs((e[a1]||0)+(e[a2]||0)-(e[b1]||0)-(e[b2]||0));
    const rp=(pr.p[k2(a1,a2)]||0)+(pr.p[k2(b1,b2)]||0);const ro=[[a1,b1],[a1,b2],[a2,b1],[a2,b2]].reduce((t,[x,y])=>t+(pr.o[k2(x,y)]||0),0);
    const c=d*w.bal+rp*w.rp+ro*w.ro+(stacked(a1,a2,b1,b2)?w.stack:0);if(!best||c<best.c)best={c,order:[a1,a2,b1,b2]}}
  return{cost:spread*w.spr+best.c,order:best.order}}
const rnd=n=>Math.floor(Math.random()*n);
function mix(ids,g){if(!ids.length)return[];const e=effMap(g),pr=pairMaps(g);
  const s=ids.slice().sort((a,b)=>e[b]-e[a]);const gr=[];for(let i=0;i<s.length;i+=4)gr.push(s.slice(i,i+4));
  const gc=q=>groupCost(q,e,pr).cost;const cs=gr.map(gc);
  for(let it=0;it<600&&gr.length>1;it++){const a=rnd(gr.length),b=rnd(gr.length);if(a===b)continue;const i=rnd(4),j=rnd(4);
    const X=gr[a].slice(),Y=gr[b].slice();const t=X[i];X[i]=Y[j];Y[j]=t;const cx=gc(X),cy=gc(Y);
    if(cx+cy<cs[a]+cs[b]-1e-9){gr[a]=X;gr[b]=Y;cs[a]=cx;cs[b]=cy}}
  return gr.map(q=>groupCost(q,e,pr).order)}
const orderQ=(q,g)=>groupCost(q,effMap(g),pairMaps(g)).order;

/* ---------- fair share: 5 games per 2 h, scaled by time present ---------- */
function presentSec(g,id,t){const d=g.d,st=Math.max(bookStart(d),g.st||0),en=g.en||sessEnd(d),a=att(d,id);
  if(!a||!a.a)return 0;return Math.max(0,Math.min(a.l||en,en)-Math.max(a.a,st))/1000}
function target(g,id){const len=Math.max(1,sessLenH(g.d))*3600,base=TGT*sessLenH(g.d)/2;
  if(!g.st)return Math.round(base);const a=att(g.d,id);if(!a||!a.a)return Math.round(base);
  return Math.max(1,Math.round(base*Math.min(1,presentSec(g,id)/len)))}
const courtOpen=(g,i,t)=>(t||Date.now())<courtEnd(g.d,i);
const blocked=(g,id,t)=>(g.strk[id]||0)>=2&&!(g.since[id]!=null&&t-g.since[id]>=REST);
/* live order: regulars below target first (furthest behind), then regulars at target, dummies only as fillers; longest wait breaks ties */
function priority(g,exclude){const cnt=counts(g,true),t=Date.now(),bk=ruleOn('wait')?5:20;
  return onIds(g.d).filter(id=>eligible(g.d,id)&&!exclude.has(id)&&!blocked(g,id,t)).map(id=>{const c=cnt[id]||0,tg=target(g,id);
    return{id,o:isDum(g.d,id)?3:c>=tg?2:0,r:Math.round(c/Math.max(1,tg)*bk),w:g.since[id]!=null?t-g.since[id]:0,x:Math.random()}})
    .sort((a,b)=>a.o-b.o||a.r-b.r||b.w-a.w||a.x-b.x).map(x=>x.id)}
const logIt=(g,m)=>{g.log.unshift({t:Date.now(),m});if(g.log.length>60)g.log.length=60};

/* Up Next adapts itself: 'fill' fills gaps, 'all' rebuilds every Up Next game the admin did not place */
function autoNext(g,mode,why){if(!running(g))return;const t=Date.now(),d=g.d,onC=new Set(g.cur.flat().filter(Boolean));let ch=0;
  g.nxt=g.nxt.map((q,i)=>q.map(id=>{if(id&&(!eligible(d,id)||onIds(d).indexOf(id)<0)){ch=1;return null}return id}));
  g.nxt.forEach((q,i)=>{if(!courtOpen(g,i,t)&&q.some(Boolean)&&!g.nman[i]){g.nxt[i]=NUL4();ch=1}});
  const keep=i=>g.nman[i]||(mode==='fill'&&g.nxt[i].every(Boolean));
  const fixed=new Set();g.nxt.forEach((q,i)=>{if(keep(i)||mode==='fill')q.forEach(id=>id&&fixed.add(id))});
  const pool=priority(g,new Set([...onC,...fixed]));
  const open=g.nxt.map((q,i)=>i).filter(i=>courtOpen(g,i,t)&&!keep(i));
  if(mode==='all'){const n=Math.min(open.length,Math.floor(pool.length/4)),gr=mix(pool.slice(0,n*4),g);
    open.forEach((i,k)=>{const nq=gr[k]||NUL4();if(nq.join()!==g.nxt[i].join())ch=1;g.nxt[i]=nq;g.auto[i]=nq.slice()})}
  else open.forEach(i=>{const q=g.nxt[i];
    if(!q.some(Boolean)){const pr=g.pre&&g.pre[i];
      if(pr&&pr.every(id=>id&&pool.includes(id))){pr.forEach(id=>pool.splice(pool.indexOf(id),1));g.nxt[i]=orderQ(pr,g);g.pre[i]=null}
      else if(pool.length>=4){g.nxt[i]=mix(pool.splice(0,4),g)[0]}else return;g.auto[i]=g.nxt[i].slice();ch=1}
    else if(q.some(x=>!x)&&pool.length>=q.filter(x=>!x).length){const f=q.map(x=>x||pool.shift());g.nxt[i]=orderQ(f,g);g.auto[i]=g.nxt[i].slice();ch=1}});
  if(ch&&why)logIt(g,why);return ch}

/* ---------- planned games (before Start session): whole booked time, per court ---------- */
const slotOf=g=>Math.max(5,num(g.slot)||15)+Math.max(0,num(g.chg));
const courtRounds=(g,i)=>Math.floor(num((courtsOf(g.d)[i]||{}).h)*60/slotOf(g));
const planRounds=g=>Math.max(1,...courtsOf(g.d).map((c,i)=>courtRounds(g,i)));
const totSlots=g=>courtsOf(g.d).reduce((a,c,i)=>a+courtRounds(g,i),0);
const planSig=g=>[onIds(g.d).sort().join(','),JSON.stringify(courtsOf(g.d)),g.slot,g.chg,(S.orgs||[]).join(','),JSON.stringify((S.days[g.d]||{}).dm||{}),S.players.map(p=>p.lv).join(''),(S.rules||[]).filter(r=>r.on).map(r=>r.k).join('')].join('/');
const tier=(d,id,c)=>isDum(d,id)?3:c>=TGT?2:0;
function buildPlan(g){let best=null;const ids=onIds(g.d);for(let k=0;k<80;k++){if(k===40&&best.sc<100)break;const p=planOnce(g,k>=40),cn={};let em=0;
  p.forEach((rd,r)=>rd.forEach((q,i)=>{if(q.every(Boolean))q.forEach(id=>cn[id]=(cn[id]||0)+1);else if(r<courtRounds(g,i))em++}));
  const rc=ids.filter(id=>!isDum(g.d,id)).map(id=>cn[id]||0),oc=ids.filter(id=>isDum(g.d,id)).reduce((a,id)=>a+(cn[id]||0),0),sc=em*100+(rc.length?Math.max(...rc)-Math.min(...rc):0)*3+oc*.2;if(!best||sc<best.sc)best={sc,p};if(!sc)break}
  const keep=g.nxt.map((q,i)=>g.nman[i]?q:null);g.nxt=best.p[0].map((q,i)=>keep[i]||q);g.plan=best.p.slice(1);g.psig=planSig(g)}
function planOnce(g,soft){const ids=onIds(g.d),R=planRounds(g),fake={d:g.d,hist:[]},c={},st={},lr={},rounds=[],nC=courtsOf(g.d).length;
  for(let r=0;r<R;r++){const av=[];for(let i=0;i<nC;i++)if(r<courtRounds(g,i)||(r===0&&!courtRounds(g,i)))av.push(i);
    const pool=ids.filter(id=>!(lr[id]===r-1&&st[id]>=2)).map(id=>{const k=c[id]||0;return{id,c:k,o:tier(g.d,id,k),s:lr[id]===r-1?st[id]:0,x:Math.random()}}).sort((a,b)=>a.o-b.o||(a.c+a.s*.75)-(b.c+b.s*.75)||a.x-b.x).map(x=>x.id);
    const n=Math.min(av.length,Math.floor(pool.length/4));const gr=n?mix(pool.slice(0,n*4),fake):[];gr.forEach(q=>{fake.hist.unshift({ids:q,sa:0,sb:0});q.forEach(id=>{st[id]=lr[id]===r-1?(st[id]||0)+1:1;c[id]=(c[id]||0)+1;lr[id]=r})});
    const rd=[];for(let i=0;i<nC;i++)rd.push(NUL4());av.forEach((i,k)=>{if(gr[k])rd[i]=gr[k]});rounds.push(rd)}
  return rounds}
function ensurePlan(g){if(g.st)return;if(g.psig!==planSig(g))return buildPlan(g);const on=new Set(onIds(g.d));g.plan=g.plan.map(rd=>rd.map(q=>q.map(id=>id&&on.has(id)?id:null)))}
const qref=(g,x)=>{const a=String(x).split('.').map(Number);return a[0]?g.plan[a[0]-1][a[1]]:g.nxt[a[1]]};

/* ---------- bench time ---------- */
function benchOn(g,id,t){if(!running(g)||!eligible(g.d,id))return;if(g.since[id]==null)g.since[id]=t}
function benchOff(g,id,t){if(g.since[id]!=null){g.btot[id]=(g.btot[id]||0)+Math.max(0,t-g.since[id])/1000;delete g.since[id]}}
function benchSec(g,id,t){if(g.man&&!running(g)&&g.st&&g.en&&!Object.keys(g.btot).length){const pl2=g.hist.filter(h=>h.ids.includes(id)).reduce((a,h)=>a+h.s,0);return Math.max(0,(g.en-g.st)/1000-pl2)}
  return(g.btot[id]||0)+(running(g)&&g.since[id]!=null?((t||Date.now())-g.since[id])/1000:0)}
const tn=(h,k)=>{const n=h.ids.slice(k*2,k*2+2).map(nameOf);return n.every(x=>x!=='?')?n.join(' & '):((k?h.b:h.a)||[]).join(' & ')};
const hlab=h=>(h.m?'Manual':'#'+(h.r||'–'))+(h.s!=null&&h.at?' · '+hm(h.at-h.s*1000):'');

/* ---------- court flow ---------- */
function saveGame(g,i,t){t=t||Date.now();const q=g.cur[i],L=g.live[i];const s=Math.max(0,L.run?(t-L.start)/1000:(L.el||0));

function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function dupInfo(nm,skip){nm=nm.trim().toLowerCase().replace(/\s+/g,' ');if(!nm)return null;const L=S.players.filter(p=>!p.gone&&p.id!==skip);

let lastAuto=0;
function tick(){const now=Date.now();
  if(ui.scr==='home'){const el=document.querySelector('[data-tk="sess"]'),g=S.games[TODAY()];if(el&&g&&g.st)el.textContent=fmtH(((g.en||now)-g.st)/1000);return}
  if(ui.scr!=='app'||ui.tab!=='games')return;const g=S.games[curDate()];if(!g)return;const run=running(g);
  if(g.en&&now-g.en>=REOPEN_MS&&document.querySelector('[data-a="reopen"]'))return render();
  if(run&&now-lastAuto>30e3){lastAuto=now;const cl=g.cur.some((q,i)=>!courtOpen(g,i,now)&&g.nxt[i].some(Boolean));if(autoNext(g,'fill',cl?'A court booking ended · its Up Next was cleared':null)){save();return render()}}
  document.querySelectorAll('[data-tk]').forEach(el=>{const k=el.dataset.tk;
    if(k==='court'){const L=g.live[+el.dataset.i];if(L&&L.run)el.textContent=fmt((now-L.start)/1000)}
    else if(k==='bench'){const s=run&&g.since[el.dataset.id]!=null?(now-g.since[el.dataset.id])/1000:0;el.lastChild.textContent=fmt(s);el.classList.toggle('red',s>900)}
    else if(k==='sess'){if(g.st)el.textContent=fmtH(((g.en||now)-g.st)/1000)}
    else if(k==='left'){const l=courtEnd(g.d,+el.dataset.i)-now;el.textContent=Math.max(0,Math.ceil(l/60e3))+' min left';el.style.color=l<10*60e3?'var(--bad)':l<20*60e3?'var(--y)':'var(--ok)'}
    else if(k==='tot'){const id=el.dataset.id;const s=benchSec(g,id,now);el.textContent=fmtL(s);el.style.color=s>1800?'var(--bad)':'var(--tx)'}})}

/* ---------- PDF report: exactly the Kitty selection ---------- */
function vReport(ds,title){const all=allCalc(),sel=all.filter(s=>ds.includes(s.d));
  const T=(h,r)=>'<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.join('')+'</tbody></table>',tr=c=>'<tr>'+c.map(x=>'<td>'+x+'</td>').join('')+'</tr>';
  const tl=a=>'<div class="tl">'+a.map(([l,v])=>'<div><i>'+l+'</i><b>'+v+'</b></div>').join('')+'</div>';
  const secs=sel.map((s,k)=>{const g=S.games[s.d];
    const pay=s.ids.slice().sort((a,b)=>nameOf(a).localeCompare(nameOf(b))).map(id=>{const p=payOf(s.f,id);return tr([esc(nameOf(id)),p?'Paid · '+(p.m==='bank'?'Bank':'Cash')+(p.by?' · '+esc(nameOf(p.by)):''):'<b style="color:#C0392B">Not paid</b>',p?A(s.FEE):'—'])});
    const ex=[tr(['Court booking',esc(s.loc)+' · '+courtSum(s.d)+(s.pk?' · package share':''),A(s.COURT)]),tr(['Shuttles',num(s.f.used)+' × '+A(s.PER),A(s.shut)])].concat(s.f.oth.map(o=>tr([esc(o.lab||'Misc'),o.by?esc(nameOf(o.by)):'',A(num(o.amt))])));
    let gm='<div class="bar">GAMES</div><div>No games recorded.</div>';
    if(g&&(g.hist.length||g.st)){const cnt=counts(g,false),tot=g.hist.reduce((a,h)=>a+h.s,0);
      const rows=g.hist.slice().reverse().sort((a,b)=>a.c-b.c).map((h,j)=>{const tie=h.sa===h.sb,aw=h.sa>h.sb;return tr([j+1,esc(cname(s.d,h.c-1))+' · '+hlab(h),esc(tn(h,0)),'<b>'+h.sa+' – '+h.sb+'</b>',esc(tn(h,1)),tie?'Draw':esc(tn(h,aw?0:1)),fmt(h.s)])});
      const ppl=[...new Set([...s.ids,...Object.keys(cnt)])].filter(id=>P(id)).sort((a,b)=>(cnt[a]||0)-(cnt[b]||0)||nameOf(a).localeCompare(nameOf(b)));
      gm='<div class="bar">GAMES · '+g.hist.length+' games · average '+(g.hist.length?fmt(tot/g.hist.length):'—')+'</div>'+(rows.length?T(['#','COURT · GAME','TEAM A','SCORE','TEAM B','WINNER','TIME'],rows):'<div>No games recorded.</div>')+
       '<div class="bar keep">GAMES PLAYED, ATTENDANCE &amp; BENCH TIME</div>'+T(['NAME','GAMES','ARRIVED','LEFT','BENCH TIME'],ppl.map(id=>{const a=att(s.d,id);return tr([esc(nameOf(id)),cnt[id]||0,a&&a.a?hm(a.a):'—',a&&a.l?hm(a.l):'—',fmtH(benchSec(g,id))])}))}
    return '<div'+(k?' class="pb"':'')+'><h2>Session '+s.no+' · '+dlab(s.d)+' · '+esc(s.loc)+'</h2><div class="meta">Start '+(s.st?hm(s.st):'—')+' · End '+(s.en?hm(s.en):s.st?'still running':'—')+' · Played '+(s.ps?fmtH(s.ps):'—')+' / Booked '+hrsL(s.bh)+' ('+courtSum(s.d)+') · '+s.pl+' players · Court fee '+A(s.COURT)+' · Shuttle '+A(s.PER)+' each</div>'+
     tl([['Collected',A(s.ret)],['Spent',A(s.inv)],['Balance','AED '+sg(s.sav)],['Pending',(s.pl-s.pdn)+(s.due?' · '+A(s.due):'')],['Cost per head',s.pl?A(s.inv/s.pl):'—']])+
     '<div class="cols"><div><div class="bar">PAYMENTS · '+s.pdn+' / '+s.pl+' PAID · FEE '+A(s.FEE)+'</div>'+T(['NAME','STATUS','AMOUNT'],pay.length?pay:[tr(['No players','',''])])+'</div><div><div class="bar">EXPENSES · '+A(s.inv)+'</div>'+T(['ITEM','DETAIL','AMOUNT'],ex)+'</div></div>'+gm+'</div>'}).join('');
  const sum=k=>sel.reduce((a,s)=>a+s[k],0),pi=sum('inv'),pr=sum('ret'),U=unpaidList(sel);
  const per=sel.length>1?'<div class="pb"><h2>Summary · '+esc(title)+'</h2>'+tl([['Sessions',sel.length],['Invested',A(pi)],['Returns',A(pr)],['Saved','AED '+sg(pr-pi)],['Games',sum('ng')]])+
   '<div class="bar">SESSIONS</div>'+T(['SESSION','LOCATION','COURTS · HOURS','COURT FEE','SHUTTLE','PAID','PLAYED / BOOKED','INVESTED','RETURNS','SAVED'],sel.map(s=>tr(['S'+s.no+' · '+dlab(s.d),esc(s.loc),courtSum(s.d),A(s.COURT),A(s.PER),s.pdn+' / '+s.pl,(s.ps?fmtH(s.ps):'—')+' / '+hrsL(s.bh),A(s.inv),A(s.ret),'AED '+sg(s.sav)])))+
   (U.length?'<div class="bar">UNPAID</div>'+T(['NAME','SESSIONS'],U.map(u=>tr([esc(nameOf(u.id)),u.ds.map(dlab).join(', ')]))):'')+
   '<div class="ult keep"><div class="bar">SUMMARY · '+esc(title.toUpperCase())+'</div><div><b>Tips</b>'+selTips(sel).map(x=>'<div>→ '+esc(x)+'</div>').join('')+'</div></div></div>':'';
  return '<div class="rhead"><b>REBELS BADMINTON</b><span>Report · '+esc(title)+' · made '+dlab(TODAY())+' '+hm(Date.now())+'</span></div>'+secs+per}

   if(!L.sa&&!L.sb){if(!confirm('No score entered. Discard this game timer?'))return;const q=g.cur[i],t=Date.now();g.cur[i]=NUL4();g.live[i]=blankLive();q.forEach(id=>id&&benchOn(g,id,t));save();return render()}

 enfrom:x=>{ui.ent.from=x;render()},ento:x=>{ui.ent.to=x;render()},enby:x=>{ui.ent.by=x;render()},
 entdel:()=>{if(!confirm('Delete this entry?'))return;S.ent=S.ent.filter(o=>o.id!==ui.ent.id);ui.ent=null;save();render()},entsave:()=>entSave(),

 dpts:x=>{S.def.pts=+x;applyDef('pts');if(+x===30){S.def.deuce=false;applyDef('deuce')}save();render()},ddeuce:()=>{S.def.deuce=!S.def.deuce;applyDef('deuce');save();render()},

 bimport:()=>{const s=parse(($('#bimp').value||'').trim());if(!s)return toast('That is not a valid backup');

};
function applyDef(f){const t=TODAY();Object.values(S.games).forEach(g=>{if(!g.st&&g.d>=t){g[f]=S.def[f];g.psig=''}})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='noop'){e.stopPropagation();return}
  if(el.classList.contains('modal')&&e.target!==el)return;if(el.disabled)return;
  const f=act[el.dataset.a];if(f){e.stopPropagation();f(el.dataset.x,el.dataset.y)}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.i;if(!k)return;
  if(k==='nm'){ui.nm=el.value;$('#dup').innerHTML=vDup()}
  else if(k==='q'){ui.q=el.value;$('#pgrid').innerHTML=vGrid()}
  else if(k==='ename'){ui.pm.name=el.value;const d=dupInfo(el.value,ui.pm.id);$('#edup').innerHTML=d?'<div class="warn '+(d.red?'red':'yel')+'">⚠ '+esc(d.msg)+'</div>':''}
  else if(k==='eph'){ui.pm.ph=el.value}
  else if(k==='sc_n'){ui.sc.courts[+el.dataset.x].n=el.value}
  else if(k.startsWith('am_')){ui.am[k.slice(3)]=el.value}
  else if(k.startsWith('f_')){const f=k.slice(2);finOf(ui.fsel,true)[f]=el.value;S.def[f]=el.value;save();ui.saved='✓ Auto-saved';const s=$('#fsaved');if(s)s.textContent=ui.saved;clearTimeout(window.__fr);window.__fr=setTimeout(()=>{const a=document.activeElement,id=a&&a.dataset.i;render();if(id){const n=document.querySelector('[data-i="'+id+'"]');if(n){n.focus();const v=n.value;try{n.setSelectionRange(v.length,v.length)}catch(err){}}}},700)}
  else if(k.startsWith('ge_')){const e=ui.ge,f=k.slice(3);e[f]=el.value;if(f==='en'&&e.st&&el.value){let m=(tms(e.d,el.value)-tms(e.d,e.st))/60000;if(m<=0)m+=1440;e.du=Math.round(m);$('#ge_du').value=e.du}
    else if((f==='st'||f==='du')&&$('#ge_en'))$('#ge_en').value=e.st&&num(e.du)?hm(tms(e.d,e.st)+num(e.du)*60000):''}
  else if(k.startsWith('se_')){ui.se[k.slice(3)]=el.value}
  else if(k.startsWith('en_')){ui.ent[k.slice(3)]=el.value}
  else if(k.startsWith('d_')){const f=k.slice(2);S.def[f]=el.value;applyDef(f);save()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='pname'){e.preventDefault();act.add()}else if(id==='nloc'){e.preventDefault();act.saveloc()}else if(id==='oamt'){e.preventDefault();act.addoth()}});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;
  if(c==='scdate'){if(el.value){ui.sc.d=el.value;render()}}
  else if(c==='sctime'){ui.sc.time=el.value;render()}
  else if(c==='scloc'){if(el.value==='__new'){ui.scNew=true;render();setTimeout(()=>$('#nloc')&&$('#nloc').focus(),50)}else{ui.sc.loc=el.value;render()}}
  else if(c==='slot'){if(!el.value)return;const g=CG(),x=el.dataset.x;qref(g,x)[+el.dataset.y]=el.value;
    if(String(x)[0]==='0'){const i=+String(x).split('.')[1];g.nman[i]=1;if(running(g)&&g.nxt[i].every(Boolean)){g.nxt[i]=orderQ(g.nxt[i],g);recordOverride(g,i)}}save();render()}
  else if(c==='cfslot'){const g=CG(),i=ui.cf.i,k=+el.dataset.y,v=el.value||null;g.nxt.forEach((q,j)=>{if(j!==i)g.nxt[j]=q.map(x=>x===v?null:x)});g.nxt[i][k]=v;g.nman[i]=1;
    if(g.nxt[i].every(Boolean))recordOverride(g,i);save();render()}
  else if(c==='fsel'){ui.ks.s=el.value;ui.saved='';render()}
  else if(c==='ksmo'){ui.ks.mo=el.value;render()}else if(c==='ksy'){ui.ks.y=el.value;render()}else if(c==='ksa'){ui.ks.a=el.value;render()}else if(c==='ksb'){ui.ks.b=el.value;render()}
  else if(c==='rpv'){ui.rp.v=el.value;render()}
  else if(c==='en_loc'){ui.ent.loc=el.value}
  else if(c==='ge_p'){ui.ge.ids[+el.dataset.y]=el.value||null;render()}
  else if(c==='ge_c'){ui.ge.c=+el.value}});
setInterval(tick,1000);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();ui.unlocked=false;ui.hun=false}else{topUp();render()}});

/* ---------- data upgrade ---------- */
function migrate(){const t=TODAY();S.dum=S.dum||{};S.def=Object.assign({pts:21,deuce:true,slot:15,chg:2,court:'',fee:'',spt:12},S.def||{});delete S.def.bh;delete S.def.box;
  ['series','ent','rules','ovr','orgs'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.eid)S.eid=1;
  S.orgs=S.orgs.filter(id=>P(id)&&!P(id).gone);
  if((S.v||0)<3){Object.keys(S.games).forEach(d=>{if(!S.days[d])S.days[d]={loc:S.locs[0]||'',on:{}}});
    Object.keys(S.days).forEach(d=>{const D=S.days[d],g=S.games[d];D.sch=1;if(!D.on)D.on={};
      if(!D.time){const st=g&&g.st?new Date(g.st):null;D.time=st?z(st.getHours())+':'+(st.getMinutes()<30?'00':'30'):'20:00'}
      if(!D.courts){const n=Math.max(1,(g&&g.courts)||1),h=num(g&&g.bh)||2;D.courts=Array.from({length:n},(_,i)=>({n:'Court '+(i+1),h}))}
      if(!D.att){D.att={};if(g&&g.st)(g.ros||[]).forEach(id=>{D.att[id]={a:g.st}})}});
    S.v=3}
  Object.keys(S.games).forEach(d=>{const g=S.games[d];g.d=d;if(g.pts==null)g.pts=S.def.pts;if(g.deuce==null)g.deuce=S.def.deuce;if(g.slot==null)g.slot=S.def.slot;if(g.chg==null)g.chg=S.def.chg;
    g.st=g.st||0;g.en=g.en||0;g.live=(g.live||[]).map(L=>L||blankLive());G(d);
    if(!g.st&&g.hist.length){const f=g.hist.map(h=>h.at-h.s*1000);g.st=Math.min(...f)}
    if(d<t&&g.st&&!g.en)endSession(g,g.hist.length?Math.max(...g.hist.map(h=>h.at)):g.st)});
  topUp()}

/* ---------- welcome → home: the logo glides into place ---------- */
const W=$('#wel'),ST=$('#stage');
function fit(){const s=Math.min(innerWidth/1194,innerHeight/834);ST.style.transform='scale('+s+')'}
fit();addEventListener('resize',fit);
let gone=false;
function enter(){if(gone)return;gone=true;const home=document.querySelector('.home'),from=$('#wlogo'),to=$('#homeLogo');
  if(!home||!from||!to){W.classList.add('hide');setTimeout(()=>W.remove(),400);return}
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),c=new Image();c.src=from.src;c.className='glide';
  Object.assign(c.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(c);
  W.classList.add('hide');requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform='translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+(b.width/a.width)+')'}));
  setTimeout(()=>{home.classList.remove('pre');home.classList.add('go');c.remove();W.remove()},620)}
W.addEventListener('click',enter);setTimeout(enter,5000);
migrate();save();render();const H0=document.querySelector('.home');if(H0)H0.classList.add('pre');

})();
