# Rebels Badminton sync – Cloudflare free tier (Workers + D1 + R2 + Access). See worker/README.md for the 10-minute setup.
name = "rebels-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# the same offline app, also at https://<worker>/app (admin/viewers on phone or laptop)
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "rebels"
database_id = "PASTE_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "rebels-photos"

# daily cloud copy at 02:00 Dubai (22:00 UTC), kept 90 days
[triggers]
crons = ["0 22 * * *"]

[vars]
ADMIN_EMAIL = "PASTE_ADMIN_EMAIL"
VIEWER_EMAILS = "PASTE_VIEWER_1,PASTE_VIEWER_2"
ACCESS_TEAM_DOMAIN = "PASTE_TEAM.cloudflareaccess.com"
ACCESS_AUD = "PASTE_ACCESS_APPLICATION_AUD"
